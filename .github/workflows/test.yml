name: CPJ Tests

on:
  push:
    branches: [ main, test-*, feature-* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Set up C++ environment
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ cmake make xvfb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Install ANTLR4
      run: |
        cd /usr/local/lib
        sudo curl -O https://www.antlr.org/download/antlr-4.13.1-complete.jar
        echo "export CLASSPATH=\".:/usr/local/lib/antlr-4.13.1-complete.jar:$CLASSPATH\"" >> ~/.bashrc
        echo "alias antlr4='java -jar /usr/local/lib/antlr-4.13.1-complete.jar'" >> ~/.bashrc
        echo "alias grun='java org.antlr.v4.gui.TestRig'" >> ~/.bashrc
        source ~/.bashrc

    - name: Build C++ components
      run: |
        rm -rf build
        cmake -S . -B build
        cmake --build build --parallel
        cp build/cpj_compiler ./cpj_compiler
        chmod +x ./cpj_compiler

    - name: Run Python tests
      run: |
        pytest --cov=. --cov-report=xml tests/

    - name: Run C++ tests
      run: |
        ctest --test-dir build --output-on-failure

    - name: Run Java tests
      run: |
        chmod +x gradlew
        xvfb-run -a ./gradlew :java:test --no-daemon

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: true
        path_to_write_summary: ./coverage/codecov_report.txt
        verbose: true

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 mypy pylint black isort
        
    - name: Run linters
      run: |
        flake8 . --exclude=.git,__pycache__,.venv,cpj_venv,.tools,build,dist,generated,htmlcov,.pytest_cache,.gradle,bin,java/build,java/bin,cpj-local-release-*,CPJLexer.py,CPJListener.py,CPJParser.py,grammar --count --max-complexity=10 --max-line-length=100 --statistics
        mypy . --strict --exclude '(^|/)(\.venv|cpj_venv|\.tools|build|dist|generated|htmlcov|\.pytest_cache|\.gradle|bin|java/build|java/bin|cpj-local-release-[^/]+|CPJLexer\.py|CPJListener\.py|CPJParser\.py|grammar)(/|$)'
        pylint --rcfile=.pylintrc --ignore=.venv,cpj_venv,.tools,build,dist,generated,htmlcov,.pytest_cache,.gradle,bin,cpj-local-release-1.1.0,CPJLexer.py,CPJListener.py,CPJParser.py,grammar --ignore-paths='^java/(build|bin)/' .
        black . --check --extend-exclude '(\.venv|cpj_venv|\.tools|build|dist|generated|htmlcov|\.pytest_cache|\.gradle|bin|java/(build|bin)|cpj-local-release-[^/]+|CPJLexer\.py|CPJListener\.py|CPJParser\.py|grammar)'
        isort . --check-only --skip .venv --skip cpj_venv --skip .tools --skip build --skip dist --skip generated --skip htmlcov --skip .pytest_cache --skip .gradle --skip bin --skip java/build --skip java/bin --skip cpj-local-release-1.1.0 --skip CPJLexer.py --skip CPJListener.py --skip CPJParser.py --skip grammar

  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        
    - name: Run security checks
      run: |
        bandit -r . -ll -x .venv,cpj_venv,.tools,build,dist,generated,htmlcov,.pytest_cache,.gradle,bin,java/build,java/bin,cpj-local-release-1.1.0,CPJLexer.py,CPJListener.py,CPJParser.py,grammar
        safety check
