name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: g++
            python: '3.12'
          - os: ubuntu-latest
            compiler: clang
            cc: clang++
            python: '3.12'
          - os: macos-latest
            compiler: clang
            cc: clang++
            python: '3.12'
          - os: windows-latest
            compiler: msvc
            cc: cl
            python: '3.12'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python }}

    - name: Cache ccache
      if: runner.os != 'Windows'
      uses: actions/cache@v4
      with:
        path: |
          ~/.ccache
        key: ${{ runner.os }}-ccache-${{ hashFiles('**/*.cpp','**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-ccache-

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python }}-requirements-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python }}-requirements-

    - name: Install Python deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Install build tools (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        sudo apt-get update || true
        # Install ccache and build tools. Use clang if requested.
        if [ "${{ runner.os }}" = "Linux" ]; then
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang ccache || true
          else
            sudo apt-get install -y build-essential wget ccache || true
          fi
        fi

    - name: Build cpj_compiler (Windows)
      if: runner.os == 'Windows' && matrix.compiler == 'msvc'
      shell: powershell
      run: |
        cl /EHsc /O2 cpj_compiler.cpp /Fe:cpj_compiler.exe

    - name: Build cpj_compiler (Unix)
      if: runner.os != 'Windows'
      run: |
        # Use ccache when available to speed up repeated builds in CI
        if command -v ccache > /dev/null 2>&1; then
          ccache --max-size=200M || true
          ccache ${{ matrix.cc }} -std=c++17 -O2 -o cpj_compiler cpj_compiler.cpp
        else
          ${{ matrix.cc }} -std=c++17 -O2 -o cpj_compiler cpj_compiler.cpp
        fi
    - name: Install ccache on macOS
      if: runner.os == 'macOS'
      run: |
        # Ensure Homebrew is available and install ccache
        if ! command -v brew > /dev/null 2>&1; then
          echo "Homebrew not found on macOS runner; skipping ccache install.";
        else
          brew install ccache || true
        fi

    - name: Run quick tests (make ci-quick -> pytest with junit xml)
      run: |
        # Run the Makefile CI-specific quick test target which sets PYTHONPATH and produces reports/junit.xml
        make -B ci-quick

    - name: Upload quick test report
      uses: actions/upload-artifact@v4
      with:
        name: quick-test-report-${{ matrix.os }}-${{ matrix.compiler }}
        path: reports/junit.xml

  full-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-3.12-requirements-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-3.12-requirements-
    - name: Install Python deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    - name: Build cpj_compiler
      run: |
        g++ -std=c++17 -O2 -o cpj_compiler cpj_compiler.cpp
    - name: Run full tests (pytest with junit xml + coverage)
      run: |
        mkdir -p reports
        pytest -q --junitxml=reports/junit.xml --cov=tools --cov-report=xml:reports/coverage.xml --cov-fail-under=80

    - name: Upload full test report
      uses: actions/upload-artifact@v4
      with:
        name: full-test-report
        path: reports/junit.xml

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: reports/coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: reports/coverage.xml
        flags: unittests
        fail_ci_if_error: true
