name: Grammar and Parser Sync

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download ANTLR jar
        run: |
          mkdir -p grammar
          curl -fSL -o grammar/antlr-4.13.2-complete.jar https://www.antlr.org/download/antlr-4.13.2-complete.jar

      - name: Generate parser from grammar
        run: |
          bash grammar/generate_parser.sh

      - name: Check for uncommitted changes in generated parser
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain generated/)" ]; then
            echo "Generated parser files are out of sync with grammar. Please run grammar/generate_parser.sh and commit the changes." >&2
            git diff generated/
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          python -m pytest -q
