[pytest]
pythonpath = .
testpaths = test
python_files = test_*.py
python_functions = test_* check_*
python_classes = Test* Check*
addopts = 
    --verbose
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --asyncio-mode=auto
    -n auto
    --timeout=300
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    lexer: Tests for lexical analysis
    parser: Tests for parsing functionality
    type_system: Tests for type system functionality
    integration: Tests spanning multiple components
    gui: Tests for GUI functionality
    house: Tests for house-related features
    async_test: Tests requiring async/await functionality